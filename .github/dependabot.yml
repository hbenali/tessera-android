version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait a few days after a release before proposing it: most compromised
    # or broken releases are yanked within days. Security updates ignore this.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Gradle 9 dropped jcenter() and needs a newer Android Gradle Plugin than the
      # Bubblewrap-generated project uses; upgrade the toolchain by hand.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
